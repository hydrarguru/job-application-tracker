<!DOCTYPE html>
<html lang="sv">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="settings.css" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
        />
        <title data-i18n="nav.settings">Inställningar</title>
        <link rel="icon" type="image/x-icon" href="favicon.ico">
        <!--favicon provided by https://www.flaticon.com/free-icon/yacht_2484964?-->
    </head>
    <body>
        <header id="header">
            <nav data-i18n-aria-label="nav.label">
                <ul>
                    <li>
                        <a href="dashboard.html"
                            ><i class="bi bi-speedometer" aria-hidden="true"></i> <span data-i18n="nav.overview">Översikt</span></a
                        >
                    </li>
                    <li>
                        <a href="charts.html"
                            ><i class="bi bi-bar-chart-fill" aria-hidden="true"></i> <span data-i18n="nav.statistics">Statistik</span></a
                        >
                    </li>
                    <li>
                        <a class="active" href="#"
                            ><i class="bi bi-gear-fill" aria-hidden="true"></i> <span data-i18n="nav.settings">Inställningar</span></a
                        >
                    </li>
                    <li class="language">
                        <label for="language-select"><i class="bi bi-translate" aria-hidden="true"></i> <span data-i18n="language.label">Språk</span></label>
                        <select id="language-select"></select>
                    </li>
                </ul>
            </nav>
        </header>
        <main id="main">
            <h1 data-i18n="nav.settings">Inställningar</h1>
            <section class="grid-container">
                <section id="settings1" class="grid-item">
                    <h1 data-i18n="settings.generateTitle">Generera Månad Dummy Data</h1>
                    <p style="font-style: italic;" data-i18n="settings.generateHint">Genererar ett jobb för varje dag i en månad</p>
                    <form id="generateMonthlyForm">
                        <label name="generateNumberRange" for="generateNumber"><span data-i18n="settings.generateCount">Antal jobbansökningar att generera:</span> <strong id="generateNumberValue">1</strong></label>
                        <input id="generateNumber" name="generateNumberInput" type="range" min="1" max="31" step="1"></input>
                        <select name="month" data-i18n-aria-label="settings.month">
                            <option value="01">Januari</option>
                            <option value="02">Februari</option>
                            <option value="03">Mars</option>
                            <option value="04">April</option>
                            <option value="05">Maj</option>
                            <option value="06">Juni</option>
                            <option value="07">Juli</option>
                            <option value="08">Augusti</option>
                            <option value="09">September</option>
                            <option value="10">Oktober</option>
                            <option value="11">November</option>
                            <option value="12">December</option>
                        </select>
                        <label for="companyName"><span data-i18n="settings.companyName">Företagsnamn</span>:</label>
                        <input id="companyName" type="text"></input>
                        <label for="jobRole"><span data-i18n="settings.jobRole">Jobbroll</span>:</label>
                        <input id="jobRole" type="text"></input>
                        <label for="jobArea"><span data-i18n="settings.jobArea">Jobbområde</span>:</label>
                        <input id="jobArea" type="text"></input>
                        <button id="generateMonthlyButton" type="button" data-i18n="settings.generate">Generera</button>
                    </form>
                </section>
            </section>
        </main>
    </body>
    <script type="module" src="./main.ts"></script>
</html>
