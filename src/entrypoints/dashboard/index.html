<!DOCTYPE html>
<html lang="sv">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="dashboard.css" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
        />
        <title data-i18n="nav.overview">Översikt</title>
        <link rel="icon" type="image/x-icon" href="favicon.ico">
        <!--favicon provided by https://www.flaticon.com/free-icon/yacht_2484964?-->
    </head>
    <body>
        <header id="header">
            <nav data-i18n-aria-label="nav.label">
                <ul>
                    <li>
                        <a class="active" href="#"
                            ><i class="bi bi-speedometer" aria-hidden="true"></i> <span data-i18n="nav.overview">Översikt</span></a
                        >
                    </li>
                    <li>
                        <a href="charts.html"
                            ><i class="bi bi-bar-chart-fill" aria-hidden="true"></i> <span data-i18n="nav.statistics">Statistik</span></a
                        >
                    </li>
                    <!--
                        <li>
                            <a href="settings.html"
                            ><i class="bi bi-gear-fill" aria-hidden="true"></i> <span data-i18n="nav.settings">Inställningar</span></a
                            >
                        </li>
                    -->
                    <li class="language">
                        <label for="language-select"><i class="bi bi-translate" aria-hidden="true"></i> <span data-i18n="language.label">Språk</span></label>
                        <select id="language-select"></select>
                    </li>
                </ul>
            </nav>
        </header>
        <main id="main">
            <h1 data-i18n="nav.overview">Översikt</h1>
            <section class="grid-container">
                <section id="total" class="grid-item">
                    <h1 data-i18n="dashboard.totalJobs">Antal sökta jobb</h1>
                    <p id="totalJobs">0</p>
                </section>
                <section id="month" class="grid-item">
                    <h1 id="totalMonthHeading"></h1>
                    <p id="totalJobsMonth">0</p>
                </section>
                <section id="today" class="grid-item">
                    <h1 data-i18n="dashboard.jobsToday">Antal sökta jobb idag</h1>
                    <p id="totalJobsToday">0</p>
                </section>
                <section id="db-grid-item" class="grid-item">
                    <h1 data-i18n="dashboard.databaseView">Databasvy</h1>
                    <table id="db-table">
                </section>
            </section>
        </main>
        <dialog id="modifyDialog">
            <h1 data-i18n="dashboard.editTitle">Modifiera objekt</h1>
            <form method="dialog">
                <div id="modifyDialogFormContainer">
                <textarea id="modifyDialogTextArea" readonly="true"></textarea>

                <label for="modifyDialogId"><span data-i18n="column.id">Id</span>:</label>
                <input id="modifyDialogId" type="text" value="" readonly></input>

                <label for="modifyDialogCompanyName"><span data-i18n="column.companyName">Företag</span>:</label>
                <input id="modifyDialogCompanyName" type="text"></input>

                <label for="modifyDialogJobRole"><span data-i18n="column.jobRole">Tjänst</span>:</label>
                <input id="modifyDialogJobRole" type="text"></input>

                <label for="modifyDialogJobArea"><span data-i18n="column.jobArea">Ort</span>:</label>
                <input id="modifyDialogJobArea" type="text"></input>

                <label for="modifyDialogJobLink"><span data-i18n="column.applicationLink">Länk</span>:</label>
                <input id="modifyDialogJobLink" type="text"></input>

                <label for="modifyDialogAppliedDate"><span data-i18n="column.appliedDate">Ansökningsdatum</span>:</label>
                <input id="modifyDialogAppliedDate" type="date"></input>
             </div>
            </form>
            <button id="modifyDialogSave" data-i18n="dashboard.save">Spara</button>
            <button id="modifyDialogClose" data-i18n="dashboard.close">Stäng</button>
        </dialog>
        <dialog id="deleteDialog">
            <form method="dialog">
                <h1 data-i18n="dashboard.deleteTitle">Är du säker?</h1>
                <p data-i18n="dashboard.deleteText">Denna åtgärd är permanent</p>
                <button id="deleteDialogConfirm" data-i18n="dashboard.yes">Ja</button>
                <button id="deleteDialogCancel" data-i18n="dashboard.no">Nej</button>
            </form>
        </dialog>
    </body>
    <script type="module" src="./main.ts"></script>
</html>
