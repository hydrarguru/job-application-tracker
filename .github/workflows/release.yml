name: Release

# A push to main whose package.json version has no release yet builds the extension and
# publishes GitHub Release v<version>, which also creates the tag. Bumping the version in a PR
# and merging it is all a release needs. Run it by hand from the Actions tab to retry.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for an existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          draft="$(gh release view "$tag" --json isDraft -q .isDraft 2>/dev/null || echo missing)"
          if [ "$draft" = "false" ]; then
            echo "Release ${tag} already exists; nothing to publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            # A draft has no tag and blocks creating the release, so drop it and publish a real one.
            if [ "$draft" = "true" ]; then
              echo "Deleting draft release ${tag}."
              gh release delete "$tag" --yes
            fi
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.version.outputs.exists == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.version.outputs.exists == 'false'
        run: npm ci

      - name: Typecheck
        if: steps.version.outputs.exists == 'false'
        run: npm run compile

      - name: Zip extensions
        if: steps.version.outputs.exists == 'false'
        run: |
          npm run zip
          npm run zip:firefox

      - name: Lint Firefox build
        if: steps.version.outputs.exists == 'false'
        run: npm run lint:firefox

      - name: Create GitHub release and tag
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" dist/*.zip --target "$GITHUB_SHA" --title "$TAG" --generate-notes
